name: paxchange
description: Simple dart script to passively synchronize installed pacman packages between systems.
version: 1.4.5
homepage: https://github.com/Skycoder42/paxchange
publish_to: none

environment:
  sdk: ^3.14.0

platforms:
  linux:

executables:
  paxchange:

dependencies:
  args: ^2.7.0
  build_cli_annotations: ^2.1.1
  dart_console: ^5.1.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  path: ^1.9.1
  riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8

dev_dependencies:
  build_cli: ^2.3.2
  build_runner: ^2.16.2
  dart_test_tools: ^8.2.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.10
  riverpod_lint: ^3.2.0
  test: ^1.33.0

dependency_overrides:
  intl: ^0.20.0

aur:
  maintainer: Skycoder42 <Skycoder42@users.noreply.github.com>
  epoch: 2
  license: BSD
  depends:
    - pacman
  install: deploy/aur/paxchange.install
  files:
    - source: deploy/aur/config.json
      target: /etc/paxchange.json
    - source: deploy/aur/paxchange.hook
      target: /usr/share/libalpm/hooks/paxchange.hook
    - source: deploy/aur/paxchange-update.sh
      target: /usr/share/libalpm/scripts/paxchange-update.sh
      permissions: 755
    - source: deploy/aur/paxchange.sysusers
      target: /usr/lib/sysusers.d/paxchange.conf
  backup:
    - etc/paxchange.json

dart_pre_commit:
  flutter-compat: false

cider:
  link_template:
    tag: https://github.com/Skycoder42/paxchange/releases/tag/v%tag%
    diff: https://github.com/Skycoder42/paxchange/compare/v%from%...v%to%
