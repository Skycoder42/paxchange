name: Continuous Integration and Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  ci:
    name: CI
    uses: Skycoder42/dart_test_tools/.github/workflows/dart.yml@main
    with:
      buildRunner: true
      unitTestPaths: --preset unit
      coverageExclude: >-
        "**.freezed.dart"
        "**.g.dart"

  integration_tests:
    name: Integration tests
    needs:
      - ci
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install unzip
        run: pacman -Sy --noconfirm unzip
      - name: Install more packages for testing
        # does not really matter which, except alpm, which is a group
        run: pacman -Sy --noconfirm alpm rsync bitwarden-cli wget hurl
      - name: Install Dart-SDK
        uses: dart-lang/setup-dart@v1.8.1
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Restore dart packages
        run: dart pub get
      - name: Create build files
        run: dart run build_runner build
      - name: Run integration tests
        run: dart test --reporter github --preset integration

  build:
    name: CD
    needs:
      - ci
      - integration_tests
    uses: Skycoder42/dart_test_tools/.github/workflows/compile.yml@main
    with:
      enabledPlatforms: ${{ needs.ci.outputs.enabledPlatforms }}
      buildRunner: true

  release:
    name: CD
    needs:
      - build
    uses: Skycoder42/dart_test_tools/.github/workflows/create-release.yml@main
    permissions:
      contents: write

  aur:
    name: CD
    needs:
      - release
    if: needs.release.outputs.releaseCreated == 'true'
    uses: Skycoder42/dart_test_tools/.github/workflows/aur.yml@main
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
